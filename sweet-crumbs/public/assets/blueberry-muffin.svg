<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="muffin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4FA"/>
      <stop offset="100%" stop-color="#EBE2F5"/>
    </linearGradient>
    <linearGradient id="muffin-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9C46A"/>
      <stop offset="60%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#BC6C25"/>
    </linearGradient>
    <linearGradient id="liner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6CCB2"/>
      <stop offset="50%" stop-color="#EDE0D4"/>
      <stop offset="100%" stop-color="#DDB892"/>
    </linearGradient>
    <filter id="mf-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A3B32" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#muffin-bg)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="245" rx="80" ry="12" fill="#D0BFB0" opacity="0.4"/>

  <g filter="url(#mf-shadow)">
    <!-- Cupcake/Muffin Paper Liner -->
    <path d="M140 160 L155 240 L245 240 L260 160 Z" fill="url(#liner)"/>
    <!-- Liner Pleats -->
    <line x1="160" y1="160" x2="170" y2="240" stroke="#B08968" stroke-width="2" opacity="0.6"/>
    <line x1="180" y1="160" x2="185" y2="240" stroke="#B08968" stroke-width="2" opacity="0.6"/>
    <line x1="200" y1="160" x2="200" y2="240" stroke="#B08968" stroke-width="2" opacity="0.6"/>
    <line x1="220" y1="160" x2="215" y2="240" stroke="#B08968" stroke-width="2" opacity="0.6"/>
    <line x1="240" y1="160" x2="230" y2="240" stroke="#B08968" stroke-width="2" opacity="0.6"/>

    <!-- Puffy Muffin Top -->
    <path d="M130 165 C110 145 120 105 160 100 C170 80 230 80 240 100 C280 105 290 145 270 165 C255 175 145 175 130 165 Z" fill="url(#muffin-top)"/>

    <!-- Blueberries -->
    <!-- Blueberry 1 -->
    <circle cx="165" cy="120" r="12" fill="#2B3A67"/>
    <circle cx="162" cy="117" r="3" fill="#6979B6"/>
    <polygon points="163,115 167,115 165,118" fill="#1C2541"/>

    <!-- Blueberry 2 -->
    <circle cx="210" cy="105" r="14" fill="#3D405B"/>
    <circle cx="206" cy="101" r="3.5" fill="#8187DC"/>
    <polygon points="208,100 212,100 210,103" fill="#1E202B"/>

    <!-- Blueberry 3 -->
    <circle cx="245" cy="130" r="11" fill="#2B3A67"/>
    <circle cx="242" cy="127" r="2.5" fill="#6979B6"/>

    <!-- Blueberry 4 half buried -->
    <circle cx="185" cy="148" r="9" fill="#283655"/>
    <circle cx="183" cy="146" r="2" fill="#6979B6"/>

    <!-- Sugar Crystals -->
    <circle cx="145" cy="135" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="190" cy="115" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="230" cy="110" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="225" cy="145" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="150" cy="152" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>

