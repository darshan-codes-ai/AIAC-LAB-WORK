<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F0"/>
      <stop offset="100%" stop-color="#FFE4E1"/>
    </linearGradient>
    <linearGradient id="frosting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2511"/>
      <stop offset="100%" stop-color="#2D1508"/>
    </linearGradient>
    <linearGradient id="sponge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F3F1F"/>
      <stop offset="100%" stop-color="#552B12"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A2511" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bg)"/>

  <!-- Cake Stand -->
  <ellipse cx="200" cy="245" rx="110" ry="14" fill="#E8D5C4" opacity="0.6"/>
  <ellipse cx="200" cy="240" rx="95" ry="10" fill="#FAF0E6"/>
  <path d="M185 240 L180 270 L220 270 L215 240 Z" fill="#E2CFBE"/>
  <ellipse cx="200" cy="270" rx="45" ry="8" fill="#D4BEAA"/>

  <!-- Cake Base & Layers -->
  <g filter="url(#shadow)">
    <!-- Bottom Layer -->
    <path d="M120 180 C120 160 280 160 280 180 L280 220 C280 235 120 235 120 220 Z" fill="url(#sponge)"/>
    <ellipse cx="200" cy="220" rx="80" ry="12" fill="url(#frosting)"/>

    <!-- Middle Cream Line -->
    <ellipse cx="200" cy="180" rx="80" ry="12" fill="#FAF3E0"/>

    <!-- Top Sponge Layer -->
    <path d="M125 140 C125 120 275 120 275 140 L275 180 C275 195 125 195 125 180 Z" fill="url(#sponge)"/>

    <!-- Top Chocolate Ganache -->
    <ellipse cx="200" cy="140" rx="75" ry="12" fill="url(#frosting)"/>

    <!-- Chocolate Drips -->
    <path d="M125 140 Q130 160 135 145 Q145 170 155 145 Q170 180 185 145 Q205 175 220 145 Q240 165 255 145 Q265 170 275 140" fill="url(#frosting)"/>

    <!-- Cherries / Toppings -->
    <circle cx="200" cy="125" r="14" fill="#C9184A"/>
    <circle cx="196" cy="122" r="4" fill="#FF758F"/>
    <path d="M200 115 Q215 95 230 100" stroke="#5C3D2E" stroke-width="3" fill="none" stroke-linecap="round"/>

    <circle cx="165" cy="130" r="11" fill="#C9184A"/>
    <circle cx="162" cy="128" r="3" fill="#FF758F"/>

    <circle cx="235" cy="130" r="11" fill="#C9184A"/>
    <circle cx="232" cy="128" r="3" fill="#FF758F"/>

    <!-- Chocolate shavings -->
    <rect x="180" y="132" width="8" height="3" rx="1.5" fill="#3D1D09" transform="rotate(25 180 132)"/>
    <rect x="210" y="133" width="7" height="3" rx="1.5" fill="#3D1D09" transform="rotate(-30 210 133)"/>
    <rect x="150" y="135" width="9" height="3" rx="1.5" fill="#3D1D09" transform="rotate(15 150 135)"/>
  </g>
</svg>

