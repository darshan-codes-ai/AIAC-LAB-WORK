<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="croissant-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FDF1E3"/>
    </linearGradient>
    <linearGradient id="cr-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="60%" stop-color="#E76F51"/>
      <stop offset="100%" stop-color="#9C441D"/>
    </linearGradient>
    <linearGradient id="cr-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8D6"/>
      <stop offset="100%" stop-color="#DDA15E"/>
    </linearGradient>
    <filter id="cr-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#7A3918" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#croissant-bg)"/>

  <!-- Shadow beneath croissant -->
  <ellipse cx="200" cy="225" rx="130" ry="18" fill="#D3A582" opacity="0.35"/>

  <!-- Croissant body -->
  <g filter="url(#cr-shadow)">
    <!-- Main Crescent Arc -->
    <path d="M70 190 C60 140 120 110 200 110 C280 110 340 140 330 190 C310 185 280 170 200 170 C120 170 90 185 70 190 Z" fill="url(#cr-gold)"/>

    <!-- Laminated Folds / Segments -->
    <!-- Center hump -->
    <ellipse cx="200" cy="145" rx="55" ry="32" fill="url(#cr-gold)"/>
    <ellipse cx="200" cy="142" rx="48" ry="26" fill="url(#cr-light)" opacity="0.8"/>
    <ellipse cx="200" cy="140" rx="42" ry="20" fill="url(#cr-gold)"/>

    <!-- Left Wing -->
    <path d="M120 160 C110 135 150 125 170 145 C150 165 130 170 120 160 Z" fill="url(#cr-gold)"/>
    <path d="M75 185 C65 165 100 150 125 165 C105 180 85 185 75 185 Z" fill="url(#cr-gold)"/>

    <!-- Right Wing -->
    <path d="M280 160 C290 135 250 125 230 145 C250 165 270 170 280 160 Z" fill="url(#cr-gold)"/>
    <path d="M325 185 C335 165 300 150 275 165 C295 180 315 185 325 185 Z" fill="url(#cr-gold)"/>

    <!-- Flaky Pastry Lines & Highlights -->
    <path d="M165 130 Q200 120 235 130" stroke="#FFE8D6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M150 145 Q200 135 250 145" stroke="#FFE8D6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M175 160 Q200 152 225 160" stroke="#7A3918" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Toasty Flakes -->
    <circle cx="180" cy="140" r="1.5" fill="#58240D"/>
    <circle cx="215" cy="145" r="2" fill="#58240D"/>
    <circle cx="230" cy="138" r="1.5" fill="#58240D"/>
  </g>
</svg>

